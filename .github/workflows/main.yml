###############################################################################
# Nokia XG-040G-MD (Airoha AN7581) OpenWrt 自动编译工作流
#
# 基于 coolsnowwolf/lede 项目，为 Nokia XG-040G-MD 路由器自动编译固件
# 支持手动触发，可选择编译包含 LuCI 的完整固件或精简固件
#
# Issue #14116 备注:
#   kmod-airoha-xpon-en757x 在 Linux 6.18 下存在编译问题
#   (-Werror=implicit-function-declaration / missing-prototypes)
#   当前 master 分支尚未包含 airoha-pon 包，暂不影响编译
#   如果后续 master 合入了 airoha-pon，需在此工作流中添加修复补丁
###############################################################################
name: Build Nokia XG-040G-MD Firmware

on:
  # 手动触发：可在 Actions 页面点击 Run workflow
  workflow_dispatch:
    inputs:
      ssh_enable:
        description: '启用 SSH 调试（默认关闭）'
        required: false
        default: 'false'
        type: boolean
      build_luci:
        description: '编译 LuCI 管理界面'
        required: false
        default: 'true'
        type: boolean
      custom_packages:
        description: '额外编译的软件包（空格分隔）'
        required: false
        default: ''
        type: string
      keep_config:
        description: '使用已有的 .config 文件（不重新生成）'
        required: false
        default: 'false'
        type: boolean
  # 定时构建：每周日 UTC 20:00（北京时间周一上午 04:00）
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  DEVICE: nokia_xg-040g-md
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-p1.sh
  DIY_P2_SH: diy-p2.sh

jobs:
  build:
    name: Compile Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: 清理空间和初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 检出工作流仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 克隆 OpenWrt 源码
        run: |
          df -hT $PWD
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH /workdir/openwrt
          sudo chown -R $USER:$GROUPS /workdir/openwrt

      - name: 更新 feeds 并安装
        run: |
          cd /workdir/openwrt
          sed -i 's/#src-git helloworld/src-git helloworld/' ./$FEEDS_CONF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载自定义配置
        run: |
          cd /workdir/openwrt
          [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config || true

      - name: 应用自定义脚本（第一阶段：源码修改）
        run: |
          cd /workdir/openwrt
          cp $GITHUB_WORKSPACE/$DIY_P1_SH ./
          chmod +x ./$DIY_P1_SH && ./$DIY_P1_SH

      - name: 应用自定义脚本（第二阶段：配置修改）
        run: |
          cd /workdir/openwrt
          cp $GITHUB_WORKSPACE/$DIY_P2_SH ./
          chmod +x ./$DIY_P2_SH && ./$DIY_P2_SH

      - name: 加载自定义设置到 .config
        run: |
          cd /workdir/openwrt
          # === 设备选择 ===
          echo "CONFIG_TARGET_airoha=y" >> .config
          echo "CONFIG_TARGET_airoha_an7581=y" >> .config
          echo "CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y" >> .config

          # === SSH 调试 ===
          if [ "${{ github.event.inputs.ssh_enable }}" == "true" ]; then
            echo "CONFIG_PACKAGE_dropbear=y" >> .config
          else
            echo "CONFIG_PACKAGE_dropbear=n" >> .config
          fi

          # === LuCI ===
          if [ "${{ github.event.inputs.build_luci }}" != "false" ]; then
            echo "CONFIG_PACKAGE_luci=y" >> .config
            echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
            echo "CONFIG_PACKAGE_luci-i18n-base-en=y" >> .config
            echo "CONFIG_PACKAGE_luci-compat=y" >> .config
            echo "CONFIG_PACKAGE_luci-lib-ipkg=y" >> .config
            echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
            echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> .config
            echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          fi

          # === 额外软件包 ===
          EXTRA_PKGS="${{ github.event.inputs.custom_packages }}"
          if [ -n "$EXTRA_PKGS" ]; then
            for pkg in $EXTRA_PKGS; do
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            done
          fi

          # === 生成完整配置 ===
          if [ "${{ github.event.inputs.keep_config }}" != "true" ]; then
            make defconfig
          fi

      - name: 下载软件包
        run: |
          cd /workdir/openwrt
          make download -j16
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -delete

      - name: 编译固件
        run: |
          cd /workdir/openwrt
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "磁盘使用情况:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: 准备产物目录
        run: |
          cd /workdir/openwrt
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/

      - name: 上传编译信息
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_buildinfo_${{ env.DEVICE }}
          path: ./artifact/buildinfo/

      - name: 上传软件包
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_package_${{ env.DEVICE }}
          path: ./artifact/package/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_${{ env.DEVICE }}
          path: ./bin/targets/

      - name: 生成发布标签
        id: tag
        run: |
          cd /workdir/openwrt
          echo "tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'schedule' || github.event.inputs.keep_config == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Nokia XG-040G-MD ${{ steps.tag.outputs.tag }}
          files: ./bin/targets/**/*
          body: |
            ## Nokia XG-040G-MD 固件编译

            **设备**: Nokia XG-040G-MD (Airoha AN7581)
            **源码**: coolsnowwolf/lede @ master
            **编译时间**: ${{ steps.tag.outputs.tag }}

            ### PON 支持
            固件已包含 GPON/XPON 内核模块（kmod-airoha-gpon-en757x / kmod-airoha-xpon-en757x），
            可直接接入 PON 网络。

            ### 刷机说明
            - **sysupgrade.tar**: 用于已安装 OpenWrt 的系统升级
            - **factory-kernel.bin** + **factory-rootfs.bin**: 用于原始系统刷机
            - 刷机前请确认设备型号，避免刷错固件导致变砖

            ### Issue #14116 说明
            `kmod-airoha-xpon-en757x` 在 Linux 6.18 下存在编译问题
            （-Werror=implicit-function-declaration / missing-prototypes）。
            编译脚本已通过放宽编译警告标志自动修复此问题。
          draft: false
          prerelease: false
