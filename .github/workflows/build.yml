name: Build_XG-040G-MD

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '选择是否开启 SSH 调试 (专业人员使用)'
        required: false
        default: false
        type: boolean
      log_switch:
        description: "单线程编译 (默认多线程)"
        required: false
        default: false
        type: boolean

env:
  FEEDS_CONF: feeds.conf.default
  DIY_P4_SH: diy-part4.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  DEVICE_NAME: "nokia_xg-040g-md"
  DEVICE_NAME_DISPLAY: "Nokia XG-040G-MD"

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
       
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        echo "GitHub Runner 硬件信息"
        echo "========================"
        echo "CPU: $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)"
        echo "核心数: $(nproc)"
        echo "内存: $(free -h | grep Mem: | awk '{print $2}')"
        echo "磁盘: $(df -h / | awk 'NR==2 {print $2}')"

    - name: Free Disk Space
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true

    - name: Space usage check  
      run: df -H
    
    - name: Set branch env
      run: |
        echo "REPO_URL=https://github.com/coolsnowwolf/lede" >> $GITHUB_ENV
        echo "REPO_BRANCH=master" >> $GITHUB_ENV
        echo "CONFIG_FILE=config/xg-040g-md.config" >> $GITHUB_ENV

    - name: Initialization environment
      id: init
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils \
          bison build-essential bzip2 ccache clang cmake cpio curl \
          device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool \
          jq lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
          lrzsz msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-ply python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip vim wget xmlto xxd zlib1g-dev
        
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: mkbootimg build
      run: |
        wget -q https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb || sudo apt-get install -f -y
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "mkbootimg found at: $MKBOOTIMG_PATH"
        else
          echo "mkbootimg not found in PATH"
        fi
        
        sudo timedatectl set-timezone "${TZ}"
        echo "status=success" >> ${GITHUB_OUTPUT}
        
    - name: Ensure Python build tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install Unidecode
        
    - name: Clone source code
      id: codes
      if: steps.init.outputs.status == 'success'
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        git pull origin "$REPO_BRANCH"
        git log --oneline -1
        cd ..
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Free up disk space
      run: |
        sudo mkdir -p /mnt/openwrt/{dl,staging_dir,build_dir}
        sudo chown -R $USER:$GROUPS /mnt/openwrt
        ln -sfn /mnt/openwrt/dl openwrt/dl
        ln -sfn /mnt/openwrt/staging_dir openwrt/staging_dir
        ln -sfn /mnt/openwrt/build_dir openwrt/build_dir
        df -H
        
    - name: DIY Part 1 - 基础定制
      run: |
        cd openwrt
        
        # 修改默认 IP 为 192.168.10.1
        sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate 2>/dev/null || true
        
        echo "DIY Part 1 完成"

    - name: DIY Part 2 - 添加插件
      run: |
        cd openwrt
        
        # TurboACC 加速
        echo "添加 TurboACC..."
        curl -sSL https://raw.githubusercontent.com/chenmozhijin/turboacc/luci/add_turboacc.sh -o add_turboacc.sh 2>/dev/null && \
          bash add_turboacc.sh 2>/dev/null || echo "TurboACC 添加失败"
        rm -f add_turboacc.sh
        
        # 温度状态插件
        echo "添加温度状态插件..."
        git clone --depth 1 https://github.com/gSpotx2f/luci-app-temp-status package/luci-app-temp-status 2>/dev/null || true
        git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-perf package/luci-app-cpu-perf 2>/dev/null || true
        
        # OpenClash
        echo "添加 OpenClash..."
        git clone --depth 1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash 2>/dev/null || true
        
        echo "DIY Part 2 完成"

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a -f

    - name: Remove warning
      run: |
        cd openwrt
        # 修复可能的编译警告
        [ -f feeds/packages/net/onionshare-cli/Makefile ] && {
          sed -i '/+python3-unidecode/d' feeds/packages/net/onionshare-cli/Makefile 2>/dev/null || true
          sed -i '/+python3-pysocks/d' feeds/packages/net/onionshare-cli/Makefile 2>/dev/null || true
          echo "修复 onionshare-cli 警告"
        }

    - name: Generate config
      run: |
        cd openwrt
        rm -f .config
        
        # 生成 XG-040G-MD 配置 (包含 PON 支持)
        echo "CONFIG_TARGET_airoha=y" >> .config
        echo "CONFIG_TARGET_airoha_an7581=y" >> .config
        echo 'CONFIG_TARGET_PROFILE="DEVICE_nokia_xg-040g-md"' >> .config
        echo "CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y" >> .config
        echo "" >> .config
        
        echo "# PON 支持" >> .config
        echo "CONFIG_PACKAGE_kmod-airoha-pon=y" >> .config
        echo "CONFIG_PACKAGE_kmod-airoha-xpon-en757x=y" >> .config
        echo "" >> .config
        
        echo "# Airoha NPU" >> .config
        echo "CONFIG_PACKAGE_airoha-en7581-npu-firmware=y" >> .config
        echo "CONFIG_PACKAGE_airoha-en7581-mt7996-npu-firmware=y" >> .config
        echo "CONFIG_PACKAGE_airoha-en8811h-firmware=y" >> .config
        echo "CONFIG_PACKAGE_kmod-phy-airoha-en8811h=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-airoha-npu=y" >> .config
        echo "" >> .config
        
        echo "# LuCI 支持" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_LUCI_AUTOREMOVE=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        echo "" >> .config
        
        echo "# 防火墙" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> .config
        echo "" >> .config
        
        echo "# 网络管理" >> .config
        echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-vlmcsd=y" >> .config
        echo "" >> .config
        
        echo "# 文件共享" >> .config
        echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y" >> .config
        echo "" >> .config
        
        echo "# 磁盘管理" >> .config
        echo "CONFIG_PACKAGE_luci-app-diskman=y" >> .config
        echo "" >> .config
        
        echo "# 代理工具" >> .config
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "" >> .config
        
        echo "# 系统监控" >> .config
        echo "CONFIG_PACKAGE_luci-app-temp-status=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-cpu-perf=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        
        make defconfig
        
    - name: SSH 调试 (有效时间6h)
      uses: mxschmitt/action-tmate@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}
      
    - name: Upload build config
      uses: actions/upload-artifact@main
      with:
        name: build-config
        path: |
          ${{ github.workspace }}/openwrt/.config
          ${{ github.workspace }}/openwrt/feeds.conf.default
        include-hidden-files: true
        
    - name: Download packages
      working-directory: ./openwrt
      run: |
        make download -j$(nproc) || make download -j1
        find dl -type f -size 0 -delete
        find dl -type f -name '*.part' -delete
        du -sh dl

    - name: Compile firmware
      id: compile
      run: |
        cd openwrt/
        if [[ "${{ inputs.log_switch }}" == "true" ]]; then
            make -j1 V=s
        elif make -j$(nproc); then
            echo "编译成功"
        else
            echo "多线程编译失败，尝试单线程..."
            make -j1 V=s | tail -200   # ← 只保留最后200行，避免日志撑爆
            exit 1                      # ← 明确报错
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}/*

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +%Y.%m.%d)-V${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "release_name=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
        
        cat > release.txt << 'EOF'
        OpenWrt 固件 - Nokia XG-040G-MD
        ========================================
        
        设备型号: Nokia XG-040G-MD (Airoha AN7581)
        编译时间: DATE_PLACEHOLDER
        源码仓库: REPO_PLACEHOLDER
        分支: BRANCH_PLACEHOLDER
        
        管理地址: 192.168.10.1
        默认账号: root / 无密码
        
        主要功能:
        - PON 光纤接入支持 (xPON GPON/EPON)
        - Airoha NPU 硬件加速
        - TurboACC 网络加速
        - OpenClash 代理工具
        - 温度/CPU 状态监控
        
        编译插件列表:
        EOF
        
        sed -i "s/DATE_PLACEHOLDER/$(date +'%Y-%m-%d %H:%M')/" release.txt
        sed -i "s|REPO_PLACEHOLDER|${{ env.REPO_URL }}|" release.txt
        sed -i "s|BRANCH_PLACEHOLDER|${{ env.REPO_BRANCH }}|" release.txt
        
        grep -h "luci-app-" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | awk -F':' '{print $NF}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -oP 'luci-app-[a-zA-Z0-9_-]+' | sort -u | sed 's/^/- /' >> release.txt
        
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 2
        KEEP_MINIMUM_RUNS: 2
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "没有需要删除的历史记录"
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "删除运行记录: $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
